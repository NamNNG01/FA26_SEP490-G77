spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 25
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

logging:
  level:
    root: INFO
    com.examprep: DEBUG

app:
  jwt:
    secret: test-only-jwt-secret-not-for-production-use-0123456789
  ai:
    # RestAiClient refuses to start without a key. Tests never call the real
    # provider: ExamAiApiIntegrationTest points app.ai.base-url at a local stub
    # server, everything else never reaches the AI endpoints.
    api-key: test-only-dummy-gemini-key
    # The flashcard worker sweep would race the tests that drive it by hand.
    flashcard:
      sweep-ms: 3600000
