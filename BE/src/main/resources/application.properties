app.ai.client=${APP_AI_CLIENT:real}
app.ai.base-url=${APP_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.model=${APP_AI_MODEL:gemini-2.5-flash}
app.ai.api-key=${GEMINI_API_KEY:}
# Disable Hibernate SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable SQL and parameter binding logs
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Disable Hibernate statistics
logging.level.org.hibernate.stat=OFF
spring.jpa.properties.hibernate.generate_statistics=false

# JDBC Batch Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# FC-07 checks its 5 MB import limit in the service; MQ-01 accepts materials up to 20 MB.
# The container limit sits above both so each service can return its spec'd error code.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
