spring:
  application:
    name: exam-prep-backend
  profiles:
    active: dev
  # Load BE/.env (KEY=VALUE, same syntax as .properties) so `mvn spring-boot:run`
  # picks up JWT_SECRET, DB and MAIL_* settings without sourcing it in the shell.
  # Real OS environment variables still take precedence. Missing file is fine.
  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Springdoc OpenAPI Config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: alpha
    tags-sorter: alpha

# Application Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
    password-reset-path: ${PASSWORD_RESET_PATH:/reset-password}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@examprep.local}
    from-name: ${MAIL_FROM_NAME:ExamPrep}
  payos:
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/return}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  # MQ-01 material files: 'cloudinary' (private raw assets) or 'local' (disk folder for dev/test).
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:data/materials}
  material-ai:
    timeout-ms: ${MATERIAL_AI_TIMEOUT_MS:120000}
  judge0:
    base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
    auth-token: ${JUDGE0_AUTH_TOKEN:}
    enabled: ${JUDGE0_ENABLED:false}
